services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "3100:3100"
    environment:
      - REDIS_URL=redis://redis:6379

volumes:
  redis-data:
